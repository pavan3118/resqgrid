services:

  postgres:
    image: postgis/postgis:18-3.6
    container_name: resqgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resqgrid
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqgrid -d resqgrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: resqgrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
